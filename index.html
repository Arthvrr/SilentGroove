<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SilentGroove</title>
<link rel="stylesheet" href="style.css?v=2">
<link rel="icon" href="logo/icon.ico" type="image/x-icon">
</head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-QVWZKPNML5"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-QVWZKPNML5');
</script>
<body>

<header class="site-header">
    <div class="logo">SilentGroove</div>
    <nav class="nav-links">
        <button id="themeToggle" class="theme-btn">Dark Mode</button>
        <a href="#" onclick="loadPage('home')">Library</a>
        <a href="#" onclick="loadPage('about')">About</a>
        <a href="#" onclick="loadPage('contact')">Contact</a>
    </nav>
</header>

<main id="main-content"></main>

<div class="player-bar hidden">
    <img id="playerThumbnail" class="player-thumb" src="" alt="">
    <div class="player-info">
        <button id="prevBtn" class="player-btn">⏮</button>
        <button id="playPauseBtn" class="player-btn">▶</button>
        <button id="nextBtn" class="player-btn">⏭</button>
        <button id="shuffleBtn" class="control-button">🔀</button>
        <span id="currentTrack">Aucune musique</span>
    </div>

    <div class="controls">
        <span id="currentTime">0:00</span>
        <input type="range" id="progress" value="0" step="1">
        <span id="duration">0:00</span>

        <div class="volume-control">
            <button id="muteBtn">🔊</button>
            <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1">
        </div>
    </div>
</div>


<audio id="audioPlayer"></audio>

<script src="app.js"></script>

</body>
</html>
